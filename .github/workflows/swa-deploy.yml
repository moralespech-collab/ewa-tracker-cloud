name: Deploy Frontend + API

# Publica web/ y api/ juntos en el Static Web App cada vez que cambian.
# Además, en cada Pull Request crea un entorno de vista previa aparte (con
# su propia URL) para que puedas ver el cambio antes de aprobarlo — y lo
# borra solo cuando el PR se cierra.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "api/**"
      - ".github/workflows/swa-deploy.yml"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
    paths:
      - "web/**"
      - "api/**"

jobs:
  build_and_deploy:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy
    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Deploy a Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "web"
          api_location: "api"
          output_location: ""

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Cerrar entorno de vista previa
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "close"